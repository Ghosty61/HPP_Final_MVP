<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HPP Industry Feed</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      max-width: 860px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0a3d62;
    }

    header p {
      font-size: 0.85rem;
      color: #6b7c93;
      margin-top: 3px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      background: #0a3d62;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    #status {
      max-width: 860px;
      margin: 0 auto 16px;
      font-size: 0.85rem;
      color: #6b7c93;
      min-height: 20px;
    }

    #feed-container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .article-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      border-left: 4px solid #0a3d62;
      transition: box-shadow 0.15s ease;
    }

    .article-card:hover {
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }

    .article-source {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0a3d62;
      margin-bottom: 6px;
    }

    .article-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .article-title a {
      color: #1a1a2e;
      text-decoration: none;
    }

    .article-title a:hover {
      color: #0a3d62;
      text-decoration: underline;
    }

    .article-description {
      font-size: 0.875rem;
      color: #4a5568;
      line-height: 1.6;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .article-date {
      font-size: 0.78rem;
      color: #9aa5b4;
    }

    .btn-read {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 14px;
      background: transparent;
      color: #0a3d62;
      border: 1.5px solid #0a3d62;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
      user-select: none;
    }

    .btn-read:hover {
      background: #0a3d62;
      color: #fff;
    }

    .btn-read svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .skeleton {
      background: #fff;
      border-radius: 12px;
      padding: 20px 22px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      border-left: 4px solid #e2e8f0;
    }

    .skeleton-line {
      height: 12px;
      background: linear-gradient(90deg, #e2e8f0 25%, #f0f4f8 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .skeleton-line.wide { width: 90%; }
    .skeleton-line.medium { width: 60%; }
    .skeleton-line.short { width: 35%; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error-msg {
      background: #fff5f5;
      border-left: 4px solid #e74c3c;
      border-radius: 12px;
      padding: 16px 20px;
      color: #c0392b;
      font-size: 0.875rem;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a1a2e;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<header>
  <div class="logo-badge">HPP</div>
  <div>
    <h1>HPP Industry Feed</h1>
    <p>Latest news from High Pressure Processing &amp; food technology sources</p>
  </div>
</header>

<div id="status">Loading feeds...</div>
<div id="feed-container"></div>



<script>
  // ── Configuration ─────────────────────────────────────────────────────────
  const MAX_ARTICLES = 40;

   // Curated HPP RSS feed — articles manually reviewed and approved by Daijyo V
  const CURATED_FEED_URL = "https://hppfeedagg-bax9j2xo.manus.space/api/rss";
  const RSS_FEEDS = [
    { label: "HPP Industry News", url: CURATED_FEED_URL },
  ];

  // Direct fetch — CORS headers are set on the curated feed server
  const PROXIES = [
    {
      build:   u => u,
      extract: async r => r.text( ),
    },
  ];

  // ── HTML stripping ────────────────────────────────────────────────────────
  /**
   * Properly strips all HTML tags and decodes HTML entities by letting the
   * browser's own DOMParser do the work — avoids regex edge cases like
   * partial tags, CDATA blocks, and nested entities.
   */
  function stripHtml(raw) {
    if (!raw) return "";
    try {
      const doc = new DOMParser().parseFromString(raw, "text/html");
      return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
    } catch (_) {
      // Fallback: remove tags by regex and decode common entities
      return raw
        .replace(/<[^>]*>/g, "")
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&nbsp;/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }
  }

  // ── Date formatting ───────────────────────────────────────────────────────
  function formatDate(dateStr) {
    if (!dateStr) return "";
    try {
      return new Date(dateStr).toLocaleDateString("en-US", {
        month: "short", day: "numeric", year: "numeric"
      });
    } catch (_) { return ""; }
  }

  // ── External link icon ───────────────────────────────────────────────────
  function externalLinkIcon() {
    return `<svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8.636 3.5a.5.5 0 0 0-.5-.5H1.5A1.5 1.5 0 0 0 0 4.5v10A1.5 1.5 0 0 0 1.5 16h10a1.5 1.5 0 0 0 1.5-1.5V7.864a.5.5 0 0 0-1 0V14.5a.5.5 0 0 1-.5.5h-10a.5.5 0 0 1-.5-.5v-10a.5.5 0 0 1 .5-.5h6.636a.5.5 0 0 0 .5-.5z"/><path fill-rule="evenodd" d="M16 .5a.5.5 0 0 0-.5-.5h-5a.5.5 0 0 0 0 1h3.793L6.146 9.146a.5.5 0 1 0 .708.708L15 1.707V5.5a.5.5 0 0 0 1 0v-5z"/></svg>`;
  }

  // ── Render helpers ────────────────────────────────────────────────────────
  function renderSkeletons(n = 4) {
    const container = document.getElementById("feed-container");
    container.innerHTML = Array.from({ length: n }, () => `
      <div class="skeleton">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line wide"></div>
        <div class="skeleton-line medium"></div>
        <div class="skeleton-line medium"></div>
      </div>
    `).join("");
  }

  function renderArticle(article) {
    const card = document.createElement("div");
    card.className = "article-card";
    card.innerHTML = `
      <div class="article-source">${article.source}</div>
      <div class="article-title">
        <a href="${article.link}" target="_blank" rel="noopener">${article.title}</a>
      </div>
      ${article.description
        ? `<div class="article-description">${article.description}</div>`
        : ""}
      <div class="article-footer">
        <span class="article-date">${formatDate(article.pubDate)}</span>
        <a class="btn-read" href="${article.link}" target="_blank" rel="noopener" aria-label="Read full article">
          ${externalLinkIcon()} Read article
        </a>
      </div>
    `;
    return card;
  }

  // ── Render from article array ─────────────────────────────────────────────
  function renderArticles(articles, failNote) {
    const statusEl   = document.getElementById("status");
    const container  = document.getElementById("feed-container");

    articles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    const seen   = new Set();
    const unique = articles.filter(a => { if (seen.has(a.link)) return false; seen.add(a.link); return true; });
    const display = unique.slice(0, MAX_ARTICLES);

    container.innerHTML = "";
    if (display.length === 0) {
      container.innerHTML = `<div class="error-msg">Could not load any articles. Check your network connection or feed URLs.</div>`;
      statusEl.textContent = "";
      return;
    }
    display.forEach(a => container.appendChild(renderArticle(a)));
    statusEl.textContent = `Showing ${display.length} of ${unique.length} articles${failNote || ""}`;
  }

  // ── RSS fetch & parse ─────────────────────────────────────────────────────
  function parseXmlItems(xmlStr, feedLabel) {
    const parser = new DOMParser();
    const xml = parser.parseFromString(xmlStr, "text/xml");
    const items = Array.from(xml.querySelectorAll("item, entry"));
    if (!items.length) throw new Error("No items in feed");
    return items.map(item => ({
      source:      feedLabel,
      title:       stripHtml(item.querySelector("title")?.textContent || ""),
      link:        item.querySelector("link")?.textContent?.trim()
                   || item.querySelector("link")?.getAttribute("href") || "#",
      description: stripHtml(
                     item.querySelector("description")?.textContent
                     || item.querySelector("summary")?.textContent || ""
                   ),
      pubDate:     item.querySelector("pubDate")?.textContent
                   || item.querySelector("published")?.textContent || "",
    }));
  }

  async function fetchFeed(feed) {
    let lastError;
    for (const proxy of PROXIES) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 9000);
        const res = await fetch(proxy.build(feed.url), { signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const xmlStr = await proxy.extract(res);
        return parseXmlItems(xmlStr, feed.label);
      } catch (e) {
        lastError = e;
      }
    }
    throw lastError;
  }

  // ── Main ──────────────────────────────────────────────────────────────────
  async function loadFeeds() {
    renderSkeletons();
    const statusEl = document.getElementById("status");
    const container = document.getElementById("feed-container");

    const results = await Promise.allSettled(RSS_FEEDS.map(fetchFeed));

    let articles = [];
    let failCount = 0;
    results.forEach((r, i) => {
      if (r.status === "fulfilled") {
        articles = articles.concat(r.value);
      } else {
        failCount++;
        console.warn(`Feed "${RSS_FEEDS[i].label}" failed:`, r.reason);
      }
    });

    articles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
    const seen = new Set();
    const unique = articles.filter(a => {
      if (seen.has(a.link)) return false;
      seen.add(a.link);
      return true;
    });
    const display = unique.slice(0, MAX_ARTICLES);

    container.innerHTML = "";
    if (display.length === 0) {
      container.innerHTML = `<div class="error-msg">Could not load any articles. Check your network connection or feed URLs.</div>`;
      statusEl.textContent = "";
      return;
    }
    display.forEach(a => container.appendChild(renderArticle(a)));
    const note = failCount > 0
      ? ` (${failCount} feed${failCount > 1 ? "s" : ""} unavailable)`
      : "";
    statusEl.textContent = `Showing ${display.length} of ${unique.length} articles${note}`;
  }

  loadFeeds();
</script>
</body>
</html>
